plugins {
    id 'com.android.application'
}

android {
    namespace 'com.gathin.tvhome'
    compileSdk 34

    defaultConfig {
        // Opt-in identity for firmware with a package-name HOME allowlist; see docs/devices/xiaomi-mitv-aetp0-dofus.md.
        applicationId providers.gradleProperty('launcherApplicationId').getOrElse('com.hushtile.home')
        minSdk 26
        targetSdk 34
        versionCode 22
        versionName '1.7'
    }

    // A release key, when one is given (HUSHTILE_KEYSTORE and its passwords, from the environment or
    // ~/.gradle/gradle.properties): published APKs must all carry the same key so they update each other.
    // Without it, release builds keep the debug key, as before. The key never lives in this repository.
    def keyFile = providers.gradleProperty('HUSHTILE_KEYSTORE').orElse(providers.environmentVariable('HUSHTILE_KEYSTORE')).getOrNull()
    def secret = { String name -> providers.gradleProperty(name).orElse(providers.environmentVariable(name)).getOrNull() }
    signingConfigs {
        if (keyFile != null) {
            hushtile {
                storeFile file(keyFile)
                storePassword secret('HUSHTILE_KEYSTORE_PASSWORD')
                keyAlias secret('HUSHTILE_KEY_ALIAS') ?: 'hushtile'
                keyPassword secret('HUSHTILE_KEY_PASSWORD') ?: secret('HUSHTILE_KEYSTORE_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            // R8 strips and optimises the code (AndroidX included): smaller APK, faster start on a slow TV CPU.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // The release key when given; otherwise the debug key, so a local build installs over a debug one.
            signingConfig keyFile != null ? signingConfigs.hushtile : signingConfigs.debug
        }
    }

    packagingOptions {
        resources {
            // Kotlin metadata pulled in by AndroidX's dependencies. This launcher is plain Java and never reads it;
            // leaving it out saves about 14 KB of every install.
            excludes += ['kotlin/**', 'META-INF/*.version', 'META-INF/*.kotlin_module', 'DebugProbesKt.bin']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.dynamicanimation:dynamicanimation:1.0.0'
    // Test only (never in the APK): plain JVM tests for the module card validators, src/test.
    testImplementation 'junit:junit:4.13.2'
    // Real org.json for unit tests (android.jar's copy only throws): DeviceProfileTest reads assets/profiles.json.
    testImplementation 'org.json:json:20231013'
}
